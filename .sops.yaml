keys:
  - &f1-msk-node 
  - &im-che-node 
  - &im-che-panel 
  - &ve-swe-node 
creation_rules:
  - path_regex: hosts/f1-msk-node/secrets\.yaml$
    key_groups:
      - age:
          - *f1-msk-node
  - path_regex: hosts/im-che-node/secrets\.yaml$
    key_groups:
      - age:
          - *im-che-node
  - path_regex: hosts/im-che-panel/secrets\.yaml$
    key_groups:
      - age:
          - *im-che-panel
  - path_regex: hosts/ve-swe-node/secrets\.yaml$
    key_groups:
      - age:
          - *ve-swe-node
